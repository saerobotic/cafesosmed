<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cafe Sosmed — segera hadir.">
  <title>Cafe Sosmed — Segera Hadir</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #3b2a20;
      background: #f6efe6;
    }

    main {
      max-width: 520px;
      text-align: center;
    }

    .cup {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3.25rem);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    h1 span {
      color: #b5651d;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #6b5648;
    }

    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 22px;
      border-radius: 999px;
      background: #3b2a20;
      color: #f6efe6;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #9a8676;
    }
  </style>
</head>
<body>
  <main>
    <div class="cup" aria-hidden="true">☕</div>
    <h1>Cafe <span>Sosmed</span></h1>
    <p>Website kami sedang diseduh. Sebentar lagi siap disajikan.</p>
    <div class="badge">Segera Hadir</div>
    <footer>&copy; 2026 cafesosmed.com</footer>
  </main>
</body>
</html>
